async function uploadDocument() {
    var titre = document.getElementById('doc-titre').value.trim();
    var description = document.getElementById('doc-description').value.trim();
    var service = documentsDossierOuvert;
    var codeActiviteEl = document.getElementById('doc-code-activite');
    var codeActivite = codeActiviteEl ? codeActiviteEl.value : null;
    var fichierInput = document.getElementById('doc-fichier');
    var fichier = fichierInput && fichierInput.files.length > 0 ? fichierInput.files[0] : null;
    
    if (!titre || !fichier) {
        alert('⚠️ Veuillez remplir le titre et sélectionner un fichier');
        return;
    }

    if (service !== 'TOUS' && documentsSousDossierOuvert !== 'cles' && !codeActivite) {
        alert('⚠️ Veuillez sélectionner le code de l\'activité liée à ce document');
        return;
    }

    var servicesDestinataires = null;
    if (service === 'TOUS') {
        var caseTous = document.getElementById('doc-dest-tous');
        if (caseTous && caseTous.checked) {
            servicesDestinataires = 'TOUS';
        } else {
            var cochees = document.querySelectorAll('.doc-dest-service:checked');
            var listeSel = [];
            for (var i = 0; i < cochees.length; i++) listeSel.push(cochees[i].value);
            if (listeSel.length === 0) {
                alert('⚠️ Sélectionnez au moins un service destinataire, ou cochez "Tous les services"');
                return;
            }
            servicesDestinataires = listeSel.join(',');
        }
    }
    
    // Vérifier le type
    var extension = fichier.name.split('.').pop().toLowerCase();
    if (['pdf', 'docx', 'xlsx', 'pptx', 'jpg', 'jpeg', 'png', 'mp4', 'mov', 'webm'].indexOf(extension) === -1) {
        alert('❌ Type de fichier non autorisé. Utilisez Word, Excel, PowerPoint, PDF, Photo ou Vidéo courte');
        return;
    }
    
    // Vérifier la taille (100 Mo max)
    if (fichier.size > 100 * 1024 * 1024) {
        alert('❌ Fichier trop volumineux (max 100 Mo)');
        return;
    }
    
    try {
        console.log('📤 Upload du document:', fichier.name);
        
        // 1. Upload vers Storage
        var timestamp = Date.now();
        var nomFichierStorage = 'doc_' + timestamp + '_' + fichier.name.replace(/\s+/g, '_');
        
        const { data: uploadData, error: uploadError } = await supabase.storage
            .from('Documents')
            .upload(nomFichierStorage, fichier);
        
        if (uploadError) {
            console.error('❌ Erreur upload:', uploadError);
            throw uploadError;
        }
        
        // 2. Le bucket est PRIVE : on stocke le chemin de stockage (pas d'URL publique
        //    possible). Une URL signee temporaire sera generee a chaque telechargement.
        console.log('✅ Fichier uploadé, chemin de stockage:', nomFichierStorage);
        
        // 3. Insérer dans la table
        const { data: insertData, error: insertError } = await supabase
            .from('documents_strategiques')
            .insert({
                titre: titre,
                description: description || null,
                type_fichier: extension,
                nom_fichier: fichier.name,
                fichier_url: nomFichierStorage,
                service: service,
                code_activite: codeActivite || null,
                services_destinataires: servicesDestinataires,
                upload_par: currentUser.nom,
                taille_ko: Math.round(fichier.size / 1024)
            })
            .select();
        
        if (insertError) {
            console.error('❌ Erreur insertion:', insertError);
            throw insertError;
        }
        
        console.log('✅ Document enregistré:', insertData);
        
        // Ajouter aux données locales
        if (insertData && insertData.length > 0) {
            documentsStrategiques.unshift(insertData[0]);
        }
        
        alert('✅ Document ajouté avec succès !');
        closeModal();
        render();
        
    } catch (error) {
        console.error('❌ Erreur complète:', error);
        alert('❌ Erreur : ' + error.message);
    }
}

async function genererPowerPointService(clicEvent) {
    if (!currentUser || currentUser.role !== 'chef') return;

    try {
        var service = currentUser.service;
        var boutonOrigine = clicEvent ? clicEvent.target : null;
        if (boutonOrigine) { boutonOrigine.disabled = true; boutonOrigine.textContent = '⏳ Génération en cours...'; }

        // Données du service, sur toute l'année (comme le Tableau de Bord
        // en mode "Toute l'année")
        var activitesService = [];
        for (var i = 0; i < data.length; i++) {
            if (data[i].service === service && data[i].valide) activitesService.push(data[i]);
        }

        var enCours = 0, terminees = 0, nonCommencees = 0;
        for (var i = 0; i < activitesService.length; i++) {
            var taux = calculerTauxSuivi(activitesService[i]);
            if (taux === 100) terminees++;
            else if (taux > 0) enCours++;
            else nonCommencees++;
        }
        var total = activitesService.length;
        var tauxExecution = total > 0 ? Math.round((terminees / total) * 100) : 0;

        var donneesObjectif = calculerDonneesGraphiqueParObjectif(activitesService);

        // ---- Construction du PowerPoint ----
        var pptx = new PptxGenJS();
        pptx.defineLayout({ name: 'A4', width: 10, height: 5.63 });
        pptx.layout = 'A4';

        // Diapo 1 : titre
        var slide1 = pptx.addSlide();
        slide1.background = { color: '1E4E8C' };
        slide1.addText('Évaluation du Service ' + service, { x: 0.5, y: 2.0, w: 9, h: 1, fontSize: 32, bold: true, color: 'FFFFFF', align: 'center' });
        slide1.addText('Préparation de l\'évaluation interne — ' + new Date().toLocaleDateString('fr-FR'), { x: 0.5, y: 3.0, w: 9, h: 0.5, fontSize: 16, color: 'D9E4F5', align: 'center' });
        slide1.addText('Ministère de l\'Éducation Nationale, de l\'Alphabétisation, de l\'Enseignement Technique et de la Formation Professionnelle', { x: 0.5, y: 4.6, w: 9, h: 0.6, fontSize: 10, color: 'AFC3E0', align: 'center' });

        // Diapo 2 : résumé chiffré
        var slide2 = pptx.addSlide();
        slide2.addText('Résumé de l\'exécution', { x: 0.4, y: 0.3, w: 9, h: 0.5, fontSize: 22, bold: true, color: '1C1F26' });

        var cartes = [
            { titre: 'Planifiées', valeur: total, couleur: '1E4E8C' },
            { titre: 'Non Commencées', valeur: nonCommencees, couleur: '6b7280' },
            { titre: 'En Cours', valeur: enCours, couleur: 'B4790C' },
            { titre: 'Exécutées', valeur: terminees, couleur: '1F6E43' },
            { titre: 'Taux d\'Exécution', valeur: tauxExecution + '%', couleur: '1E4E8C' }
        ];
        var largeurCarte = 1.7, espace = 0.15, xDepart = 0.4;
        for (var c = 0; c < cartes.length; c++) {
            var x = xDepart + c * (largeurCarte + espace);
            slide2.addShape('roundRect', { x: x, y: 1.1, w: largeurCarte, h: 1.3, fill: { color: 'F7F8FA' }, line: { color: cartes[c].couleur, width: 1.5 }, rectRadius: 0.08 });
            slide2.addText(String(cartes[c].valeur), { x: x, y: 1.35, w: largeurCarte, h: 0.6, fontSize: 24, bold: true, color: cartes[c].couleur, align: 'center' });
            slide2.addText(cartes[c].titre, { x: x, y: 2.0, w: largeurCarte, h: 0.35, fontSize: 9, color: '6b7280', align: 'center' });
        }

        // Diapo 3 : graphique par objectif (taux d'exécution)
        if (donneesObjectif.objectifs.length > 0) {
            var slide3 = pptx.addSlide();
            slide3.addText('Taux d\'Exécution par Objectif', { x: 0.4, y: 0.3, w: 9, h: 0.5, fontSize: 22, bold: true, color: '1C1F26' });

            var labelsObjectifs = [];
            for (var o = 0; o < donneesObjectif.objectifs.length; o++) labelsObjectifs.push(donneesObjectif.objectifs[o].nom);

            var groupeTaux = null;
            for (var g = 0; g < donneesObjectif.groupes.length; g++) {
                if (donneesObjectif.groupes[g].label === 'Taux d\'Exécution') groupeTaux = donneesObjectif.groupes[g];
            }

            slide3.addChart(pptx.ChartType.bar, [
                { name: 'Taux d\'exécution (%)', labels: labelsObjectifs, values: groupeTaux ? groupeTaux.valeurs : [] }
            ], { x: 0.4, y: 1.0, w: 9.2, h: 4.2, showValue: true, valAxisMaxVal: 100 });
        }

        // ---- Export en blob et dépôt dans Documents ----
        var blobPptx = await pptx.write('blob');

        var timestamp = Date.now();
        var nomFichierStorage = 'ppt_' + timestamp + '_evaluation_' + service.replace(/\s+/g, '_') + '.pptx';
        var nomAffiche = 'Évaluation ' + service + ' - ' + new Date().toLocaleDateString('fr-FR');

        const { error: uploadError } = await supabase.storage.from('Documents').upload(nomFichierStorage, blobPptx);
        if (uploadError) throw uploadError;

        const { data: insertData, error: insertError } = await supabase
            .from('documents_strategiques')
            .insert({
                titre: nomAffiche,
                description: 'PowerPoint généré automatiquement pour préparer l\'évaluation interne du service.',
                type_fichier: 'pptx',

                service: service,

                taille_ko: Math.round(blobPptx.size / 1024)
            })

        if (insertError) throw insertError;

        if (insertData && insertData.length > 0) {
            documentsStrategiques.unshift(insertData[0]);
        }

        alert('✅ PowerPoint généré et déposé dans Documents !');
        render();

    } catch (error) {
        console.error('❌ Erreur génération PowerPoint:', error);
        alert('❌ Erreur lors de la génération : ' + error.message);
        render();
    }
}

async function telechargerDocument(docId) {
    var doc = null;
    for (var i = 0; i < documentsStrategiques.length; i++) {
        if (documentsStrategiques[i].id === docId) {
            doc = documentsStrategiques[i];
            break;
        }
    }
    
    if (!doc) {
        alert('❌ Document introuvable');
        return;
    }
    
    console.log('📥 Téléchargement:', doc.titre);

    try {
        const { data: signedData, error: signedError } = await supabase.storage
            .from('Documents')
            .createSignedUrl(doc.fichier_url, 60);

        if (signedError) throw signedError;
        if (!signedData || !signedData.signedUrl) throw new Error('Impossible de générer le lien de téléchargement');

        var lien = document.createElement('a');
        lien.href = signedData.signedUrl;
        lien.download = doc.nom_fichier || (doc.titre + '.' + (doc.type_fichier || ''));
        lien.target = '_blank';
        lien.rel = 'noopener';
        document.body.appendChild(lien);
        lien.click();
        document.body.removeChild(lien);
    } catch (error) {
        console.error('❌ Erreur téléchargement:', error);
        alert('❌ Erreur lors du téléchargement : ' + error.message);
    }
}

async function supprimerDocument(docId) {
    var doc = null;
    for (var i = 0; i < documentsStrategiques.length; i++) {
        if (documentsStrategiques[i].id === docId) {
            doc = documentsStrategiques[i];
            break;
        }
    }
    
    if (!doc) {
        alert('❌ Document introuvable');
        return;
    }
    
    if (!confirm('⚠️ Supprimer "' + doc.titre + '" ?\n\nCette action est irréversible.')) {
        return;
    }
    
    try {
        console.log('🗑️ Suppression du document:', doc.titre);
        
        // 1. Supprimer du Storage (extraire le nom depuis l'URL)
        var nomFichierStorage = doc.fichier_url.split('/').pop();
        
        const { error: storageError } = await supabase.storage
            .from('Documents')
            .remove([nomFichierStorage]);
        
        if (storageError) {
            console.error('⚠️ Erreur suppression storage:', storageError);
        }
        
        // 2. Supprimer de la table
        const { error: deleteError } = await supabase
            .from('documents_strategiques')
            .delete()
            .eq('id', docId);
        
        if (deleteError) throw deleteError;
        
        // 3. Retirer des données locales
        var newDocs = [];
        for (var i = 0; i < documentsStrategiques.length; i++) {
            if (documentsStrategiques[i].id !== docId) {
                newDocs.push(documentsStrategiques[i]);
            }
        }
        documentsStrategiques = newDocs;
        
        alert('✅ Document supprimé !');
        render();
        
    } catch (error) {
        console.error('❌ Erreur suppression:', error);
        alert('❌ Erreur lors de la suppression');
    }
}

    html += '<button onclick="exporterDocument(\'txt\', \'' + nomFichier.replace(/'/g, "\\'") + '\')" style="display: block; width: 100%; text-align: left; padding: 10px 16px; border: none; background: none; cursor: pointer; font-size: 14px;" onmouseover="this.style.backgroundColor=\'#f3f4f6\'" onmouseout="this.style.backgroundColor=\'white\'">📋 Texte (.txt)</button>';
    html += '<button onclick="exporterDocument(\'png\', \'' + nomFichier.replace(/'/g, "\\'") + '\')" style="display: block; width: 100%; text-align: left; padding: 10px 16px; border: none; background: none; cursor: pointer; font-size: 14px;" onmouseover="this.style.backgroundColor=\'#f3f4f6\'" onmouseout="this.style.backgroundColor=\'white\'">🖼️ Image (.png)</button>';
    html += '</div></div>';
    
    html += '<button class="btn btn-secondary" onclick="closeModal()">❌ Fermer</button>';
    html += '</div></div>';
    
    html += '<div id="document-viewer-container" style="flex: 1; overflow: auto; background-color: #f9fafb; border-radius: 8px; padding: 16px;">';
    
    if (extension === 'pdf') {
        html += '<iframe src="' + fileUrl + '" style="width: 100%; height: 100%; min-height: 600px; border: none;"></iframe>';
    } else if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].indexOf(extension) !== -1) {
        html += '<div style="text-align: center;"><img src="' + fileUrl + '" style="max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>';
    } else if (['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'].indexOf(extension) !== -1) {
        html += '<div style="text-align: center; padding: 40px;">';
        html += '<p style="font-size: 18px; color: #6b7280; margin-bottom: 24px;">📄 Document Office détecté</p>';
        html += '<p style="margin-bottom: 16px;">Choisissez votre méthode de visualisation :</p>';
        html += '<div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">';
        var googleViewerUrl = 'https://docs.google.com/viewer?url=' + encodeURIComponent(fileUrl) + '&embedded=true';
        html += '<button class="btn btn-primary" onclick="chargerDocumentDansViewer(\'' + googleViewerUrl.replace(/'/g, "\\'") + '\')">🔍 Visualiser avec Google Docs</button>';
        var officeViewerUrl = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(fileUrl);
        html += '<button class="btn btn-success" onclick="chargerDocumentDansViewer(\'' + officeViewerUrl.replace(/'/g, "\\'") + '\')">📊 Visualiser avec Office Online</button>';
        html += '<button class="btn btn-warning" onclick="telechargerFichier(\'' + fileUrl.replace(/'/g, "\\'") + '\', \'' + nomFichier.replace(/'/g, "\\'") + '\')">⬇️ Télécharger</button>';
        html += '</div></div>';
    } else if (['txt', 'csv', 'json', 'xml', 'html', 'css', 'js'].indexOf(extension) !== -1) {
        html += '<div style="text-align: center; padding: 20px;"><p>📝 Chargement du fichier texte...</p></div>';
    } else {
        html += '<div style="text-align: center; padding: 40px;">';
        html += '<p style="font-size: 18px; color: #6b7280; margin-bottom: 16px;">⚠️ Aperçu non disponible</p>';
        html += '<button class="btn btn-primary" onclick="telechargerFichier(\'' + fileUrl.replace(/'/g, "\\'") + '\', \'' + nomFichier.replace(/'/g, "\\'") + '\')">⬇️ Télécharger</button>';
        html += '</div>';
    }
    
    html += '</div></div></div>';
    
    modalContainer.innerHTML = html;
    
    if (['txt', 'csv', 'json', 'xml', 'html', 'css', 'js'].indexOf(extension) !== -1) {
        setTimeout(function() { chargerFichierTexte(fileUrl); }, 100);
    }
}

function toggleExportMenu() {
    var menu = document.getElementById('export-menu');
    if (!menu) return;
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}

document.addEventListener('click', function(e) {
    var menu = document.getElementById('export-menu');
    var btn = document.getElementById('export-menu-btn');
    if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.style.display = 'none';
    }
});

function chargerDocumentDansViewer(viewerUrl) {
    var container = document.getElementById('document-viewer-container');
    if (!container) return;
    container.innerHTML = '<iframe src="' + viewerUrl + '" style="width: 100%; height: 100%; min-height: 600px; border: none;"></iframe>';
}

async function chargerFichierTexte(fileUrl) {
    try {
        var response = await fetch(fileUrl);
        var texte = await response.text();
        var container = document.getElementById('document-viewer-container');
        if (!container) return;
        container.innerHTML = '<pre style="background-color: white; padding: 20px; border-radius: 8px; overflow: auto; max-height: 600px; font-family: monospace; font-size: 13px; line-height: 1.5;">' + texte.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>';
    } catch (error) {
        console.error('Erreur:', error);
        var container = document.getElementById('document-viewer-container');
        if (container) container.innerHTML = '<div style="text-align: center; padding: 40px; color: #ef4444;"><p>❌ Erreur</p></div>';
    }
}

function telechargerFichier(fileUrl, nomFichier) {
    var link = document.createElement('a');
    link.href = fileUrl;
    link.download = nomFichier;
    link.target = '_blank';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function exporterDocument(format, nomFichier) {
    var container = document.getElementById('document-viewer-container');
    if (!container) {
        alert('❌ Impossible d\'exporter');
        return;
    }
    
    var menu = document.getElementById('export-menu');
    if (menu) menu.style.display = 'none';
    
    var contenu = container.innerText || container.textContent || '';
    var contenuHTML = container.innerHTML || '';
    var nomBase = nomFichier.replace(/\.[^.]+$/, '');
    
    switch(format) {
        case 'pdf': exporterEnPDF(nomBase, container); break;
        case 'docx': exporterEnWord(nomBase, contenuHTML); break;
        case 'xlsx': exporterEnExcel(nomBase, contenu); break;
        case 'pptx': exporterEnPowerPoint(nomBase, container); break;
        case 'txt': exporterEnTexte(nomBase, contenu); break;
        case 'png': exporterEnImage(nomBase, container); break;
        default: alert('⚠️ Format non supporté');
    }
}

function exporterEnPDF(nomBase, container) {
    if (typeof html2pdf === 'undefined') {
        alert('⚠️ html2pdf non disponible');
        return;
    }
    var options = {
        margin: 10,
        filename: nomBase + '.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(options).from(container).save();
}

function exporterTextesServicesPourSection(sectionId, titreSection) {
    var textesServices = obtenirTextesServicesPourSection(sectionId);
    if (textesServices.length === 0) {
        alert('Aucun texte de service à exporter pour cette section.');
        return;
    }
    var html = '<h2>' + titreSection + ' — Textes reçus des services</h2>';
    for (var i = 0; i < textesServices.length; i++) {
        html += '<h3>' + textesServices[i].service + '</h3>';
        html += '<p>' + textesServices[i].texte.replace(/\n/g, '</p><p>') + '</p>';
    }
    exporterEnWord('Textes_a_synthetiser_' + titreSection.replace(/[^a-zA-Z0-9]/g, '_'), html);
}

function exporterTousLesTextesASynthetiser() {
    var html = '<h1>Textes des services à synthétiser — Année ' + hierarchieAnneeSelectionnee + '</h1>';
    var compteur = 0;
    for (var s = 0; s < rapportCanevasData.length; s++) {
        var section = rapportCanevasData[s];
        if (section.type_section !== 'texte_libre') continue;
        var textesServices = obtenirTextesServicesPourSection(section.id);
        if (textesServices.length === 0) continue;
        compteur++;
        html += '<h2>' + section.titre + '</h2>';
        for (var i = 0; i < textesServices.length; i++) {
            html += '<h3>' + textesServices[i].service + '</h3>';
            html += '<p>' + textesServices[i].texte.replace(/\n/g, '</p><p>') + '</p>';
        }
    }
    if (compteur === 0) {
        alert('Aucun texte de service à exporter pour le moment.');
        return;
    }
    exporterEnWord('Textes_a_synthetiser_Rapport_' + hierarchieAnneeSelectionnee, html);
}

function exporterEnWord(nomBase, contenuHTML) {
    var htmlWord = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + nomBase + '</title></head><body>' + contenuHTML + '</body></html>';
    var blob = new Blob(['\ufeff', htmlWord], { type: 'application/msword' });
    telechargerBlob(blob, nomBase + '.doc');
}

async function exporterToutesLesDonnees() {
    if (typeof XLSX === 'undefined') {
        alert('❌ La bibliothèque Excel n\'a pas pu se charger. Vérifiez votre connexion internet et réessayez.');
        return;
    }

    try {
        var estExportService = (currentUser.role === 'chef');
        var wb = XLSX.utils.book_new();

        // Feuille 1 : Activités (Planification + Suivi)
        var lignesActivites = [];
        for (var i = 0; i < data.length; i++) {
            var d = data[i];
            if (estExportService && d.service !== currentUser.service) continue;
            var h = getHierarchieActivite(d);
            var taux = calculerTauxSuivi(d);
            var ligneActivite = {
                'Code': d.code || '',
                'Objectif': h.objectifNom || '',
                'Sous-Objectif': (h.sousObjectifCode ? h.sousObjectifCode + ' - ' : '') + (h.sousObjectifNom || ''),
                'Activité': d.activite || '',
                'Service': d.service || '',
                'Type de marché': d.type_marche || '',
                'T1': d.t1 ? 'Oui' : 'Non',
                'T2': d.t2 ? 'Oui' : 'Non',
                'T3': d.t3 ? 'Oui' : 'Non',
                'T4': d.t4 ? 'Oui' : 'Non',
                'Taux de suivi (%)': taux,
                'Validée': d.valide ? 'Oui' : 'Non',
                'Inclus dans le rapport': d.inclus_dans_rapport !== false ? 'Oui' : 'Non',
                'Commentaire': d.commentaire || ''
            };
            for (var c = 0; c < champsActiviteConfigData.length; c++) {
                ligneActivite[champsActiviteConfigData[c].nom_champ] = valeurChampActivite(d.id, champsActiviteConfigData[c].id) || '';
            }
            lignesActivites.push(ligneActivite);
        }
        var feuilleActivites = XLSX.utils.json_to_sheet(lignesActivites);
        XLSX.utils.book_append_sheet(wb, feuilleActivites, 'Activités');

        if (!estExportService) {
            // Feuille 2 : Hiérarchie (Objectifs et Sous-Objectifs) - ministère entier, non pertinent pour un export par service
            var lignesHierarchie = [];
            for (var i = 0; i < elementsHierarchieData.length; i++) {
                var el = elementsHierarchieData[i];
                var parentNom = '';
                if (el.parent_id) {
                    for (var j = 0; j < elementsHierarchieData.length; j++) {
                        if (elementsHierarchieData[j].id === el.parent_id) { parentNom = elementsHierarchieData[j].nom; break; }
                    }
                }
                lignesHierarchie.push({
                    'Niveau': el.parent_id ? 'Sous-Objectif' : 'Objectif',
                    'Code': el.code || '',
                    'Nom': el.nom || '',
                    'Objectif parent': parentNom,
                    'Ordre': el.ordre,
                    'Actif': el.actif ? 'Oui' : 'Non'
                });
            }
            var feuilleHierarchie = XLSX.utils.json_to_sheet(lignesHierarchie);
            XLSX.utils.book_append_sheet(wb, feuilleHierarchie, 'Hiérarchie');
        }

        // Feuille 3 : Documents
        var lignesDocuments = [];
        for (var i = 0; i < documentsStrategiques.length; i++) {
            var doc = documentsStrategiques[i];
            if (estExportService && doc.service !== currentUser.service) continue;
            lignesDocuments.push({
                'Titre': doc.titre || '',
                'Service': doc.service || '',
                'Code activité lié': doc.code_activite || '',
                'Type de fichier': doc.type_fichier || '',
                'Taille (Ko)': doc.taille_ko || '',
                'Déposé par': doc.upload_par || '',
                'Date de dépôt': doc.date_upload ? new Date(doc.date_upload).toLocaleDateString('fr-FR') : ''
            });
        }
        var feuilleDocuments = XLSX.utils.json_to_sheet(lignesDocuments);
        XLSX.utils.book_append_sheet(wb, feuilleDocuments, 'Documents');

        var nomFichier = (estExportService ? 'Export_' + currentUser.service.replace(/[^a-zA-Z0-9]/g, '_') : 'Export_Global_GestionDepartementale') + '_' + hierarchieAnneeSelectionnee + '_' + new Date().toISOString().slice(0, 10) + '.xlsx';
        XLSX.writeFile(wb, nomFichier);
    } catch (error) {
        console.error('Erreur export global:', error);
        alert('❌ Erreur lors de l\'export : ' + error.message);
    }
}

function exporterEnExcel(nomBase, contenu) {
    var lignes = contenu.split('\n');
    var csv = lignes.join('\n');
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    telechargerBlob(blob, nomBase + '.csv');
}

async function exporterEnPowerPoint(nomBase, container) {
    try {
        if (typeof PptxGenJS === 'undefined') {
            alert('❌ PptxGenJS non disponible');
            return;
        }
        
        if (typeof html2canvas === 'undefined') {
            alert('❌ html2canvas non disponible');
            return;
        }
        
        var loadingMsg = document.createElement('div');
        loadingMsg.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); z-index: 10000; text-align: center;';
        loadingMsg.innerHTML = '<h3 style="margin: 0 0 10px 0;">⏳ Création...</h3><p style="margin: 0;">Patientez</p>';
        document.body.appendChild(loadingMsg);
        
        let pptx = new PptxGenJS();
        pptx.author = 'GESTION-BSD-MEPUA';
        pptx.company = 'MEPUA';
        pptx.title = nomBase;
        pptx.layout = 'LAYOUT_16x9';
        
        const canvas = await html2canvas(container, {
            scale: 2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#ffffff'
        });
        
        const imageData = canvas.toDataURL('image/png');
        
        let slide1 = pptx.addSlide();
        slide1.background = { fill: '2563eb' };
        slide1.addText(nomBase, { x: 0.5, y: 2, w: 9, h: 1.5, fontSize: 44, bold: true, color: 'FFFFFF', align: 'center' });
        slide1.addText('Gestion Départementale - MEPUA', { x: 0.5, y: 3.8, w: 9, h: 0.5, fontSize: 20, color: 'E0E7FF', align: 'center' });
        
        let slide2 = pptx.addSlide();
        slide2.addText('Document', { x: 0.5, y: 0.3, w: 9, h: 0.6, fontSize: 28, bold: true, color: '2563eb' });
        slide2.addImage({ data: imageData, x: 0.5, y: 1, w: 9, h: 4.8 });
        
        await pptx.writeFile({ fileName: nomBase + '.pptx' });
        
        document.body.removeChild(loadingMsg);
        alert('✅ Présentation créée !');
        
    } catch (error) {
        console.error('Erreur:', error);
        alert('❌ Erreur : ' + error.message);
    }
}

function exporterEnTexte(nomBase, contenu) {
    var blob = new Blob([contenu], { type: 'text/plain;charset=utf-8' });
    telechargerBlob(blob, nomBase + '.txt');
}

function exporterEnImage(nomBase, container) {
    if (typeof html2canvas === 'undefined') {
        alert('⚠️ html2canvas non disponible');
        return;
    }
    html2canvas(container, { scale: 2, useCORS: true, allowTaint: true }).then(function(canvas) {
        canvas.toBlob(function(blob) {
            telechargerBlob(blob, nomBase + '.png');
        });
    });
}

function telechargerBlob(blob, nomFichier) {
    var url = window.URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = nomFichier;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    window.URL.revokeObjectURL(url);
}
