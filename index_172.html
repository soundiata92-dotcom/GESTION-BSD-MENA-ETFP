// ========== DONNÉES DES 43 SERVICES ==========

function generateServices() {
    return [
        'IGE', 'BSD', 'CEPPS 2040', 'DRH', 'DAF', 'CF', 'PRMP', 'SCRP',
        'CRD', 'SMSI', 'SAI', 'SHSST', 'SG-E', 'SC', 'DNEP', 'DNEF',
        'DNESGT', 'DNAENFP-LN', 'DNCaS', 'DNETFPPP', 'DNFPPE', 'DNAFPPPPS',
        'DNN', 'DGECS', 'SNECSP', 'SNIESM', 'SCEP', 'SDPCP', 'SNEPUP',
        'SNEAA', 'SNEC', 'SNFCPE', 'SNSSSS', 'INRAP', 'ONFPP', 'ANAFE', 'CNPG', 'ENPETP',
        'IRENA-ETFP de BOKE', 'IRENA-ETFP de CONAKRY', 'IRENA-ETFP de FARANAH',
        'IRENA-ETFP de KANKAN', 'IRENA-ETFP de KINDIA',
        'IRENA-ETFP de LABE', 'IRENA-ETFP de MAMOU', 'IRENA-ETFP de N\'ZEREKORE'
    ];
}

        // ========== VARIABLES GLOBALES ==========
var users = [];
        var services = generateServices();
        var currentUser = null;
        var data = [];
        var commentairesEtPreuves = [];
        var notifications = [];
        var permissionsCache = {}; 
        var activeTab = 'dashboard';
        var selectedServiceFilter = 'TOUS';
        var activeSortieTab = null; // null | 'rapport' | 'export'
        var selectedStatusFilter = 'TOUS';
        var selectedObjectifFilter = 'TOUS';
        var selectedTrimestreFilter = 'TOUS';
        var dashboardFinancementFilter = [];
        var planningTrimestreFilter = 'TOUS';
        var planningCodeFilter = [];
        var planningFinancementFilter = [];

        function changePlanningTrimestreFilter(trimestre) {
            planningTrimestreFilter = trimestre;
            render();
        }
        var dashboardHistogrammeDimension = 'service';

        function changeDashboardHistogrammeDimension(dimension) {
            dashboardHistogrammeDimension = dimension;
            render();
        }
        var suiviCodeFilter = [];
        var suiviTrimestreFilter = 'TOUS';
        var suiviTypeMarcheFilter = 'TOUS';
        var suiviEtatFilter = 'TOUS';

        function changeSuiviTrimestreFilter(trimestre) {

        }

            suiviTypeMarcheFilter = type;

            render();

        var commentairesServiceFilter = 'TOUS';
        var commentairesObjectifFilter = 'TOUS';
        var showNotifications = false;
        var connectedUsers = [];
        var utilisateursConnectesData = [];
        var rapportTextes = {};
        var rapportCanevasData = [];

        // 🔒 Verrouillage par appareil : identifie l'appareil courant
        // de façon stable (stocké localement), et en construit un
        // libellé lisible pour l'administrateur.
        function obtenirIdentifiantAppareil() {
            var id = localStorage.getItem('appareil_id');
            if (!id) {
                id = 'ap_' + Date.now() + '_' + Math.random().toString(36).substring(2, 12);
                localStorage.setItem('appareil_id', id);
            }
            return id;
        }

        function obtenirLibelleAppareil() {
            var ua = navigator.userAgent;
            var nav = 'Navigateur inconnu';
            if (ua.indexOf('Edg') > -1) nav = 'Edge';
            else if (ua.indexOf('Chrome') > -1) nav = 'Chrome';
            else if (ua.indexOf('Firefox') > -1) nav = 'Firefox';
            else if (ua.indexOf('Safari') > -1) nav = 'Safari';

            var os = 'Appareil inconnu';
            if (ua.indexOf('Windows') > -1) os = 'Windows';
            else if (ua.indexOf('Mac') > -1) os = 'Mac';
            else if (ua.indexOf('Android') > -1) os = 'Android';
            else if (ua.indexOf('iPhone') > -1 || ua.indexOf('iPad') > -1) os = 'iPhone/iPad';
            else if (ua.indexOf('Linux') > -1) os = 'Linux';

            return nav + ' sur ' + os;
        }

        // 🔥 Suivi de présence en temps réel (fonctionne entre appareils,
        // contrairement à l'ancien système basé sur localStorage)
        async function enregistrerPresence() {
            if (!currentUser) return;
            try {
                const { error } = await supabase.from('sessions_actives').upsert({
                    email: currentUser.email,
                    nom: currentUser.nom,
                    service: currentUser.service,
                    appareil_id: obtenirIdentifiantAppareil(),
                    appareil_libelle: obtenirLibelleAppareil(),
                    derniere_activite: new Date().toISOString()
                });
                if (error) {
                    console.error('❌ Erreur enregistrement présence:', error);
                }
            } catch (error) {
                console.error('Erreur enregistrement présence (exception):', error);
            }
        }

        async function chargerUtilisateursConnectes() {
            try {
                var seuil = new Date(Date.now() - 3 * 60 * 1000).toISOString();
                const { data, error } = await supabase
                    .from('sessions_actives')
                    .select('*')
                    .gt('derniere_activite', seuil)
                    .order('derniere_activite', { ascending: false });
                if (error) throw error;
                utilisateursConnectesData = data || [];
            } catch (error) {
                console.error('Erreur chargement utilisateurs connectés:', error);
            }
        }

        setInterval(function () {
            if (currentUser) enregistrerPresence();
        }, 60000);

        async function chargerRapportCanevas(annee) {
            try {
                const { data: canevas, error } = await supabase
                    .from('rapport_canevas')
                    .select('*')
                    .eq('annee', annee)
                    .eq('actif', true)
                    .order('ordre', { ascending: true });
                if (error) throw error;
                rapportCanevasData = canevas || [];
            } catch (error) {
                console.error('Erreur chargement canevas rapport:', error);
                rapportCanevasData = [];
            }
        }

        var periodeRapportSelectionnee = null;

        function obtenirPeriodeRapportParDefaut() {
            var mois = new Date().getMonth() + 1;
            if (mois <= 3) return 'T1';
            if (mois <= 6) return 'S1';
            if (mois <= 9) return 'T3';
            return 'ANNEE';
        }

        function changerPeriodeRapport(periode) {
            periodeRapportSelectionnee = periode;
            render();
        }

        function activiteDansPeriode(d, periode) {
            if (periode === 'T1') return !!d.t1;
            if (periode === 'S1') return !!d.t1 || !!d.t2;
            if (periode === 'T3') return !!d.t1 || !!d.t2 || !!d.t3;
            return !!d.t1 || !!d.t2 || !!d.t3 || !!d.t4;
        }

        function libellePeriodeRapport(periode) {
            if (periode === 'T1') return '1er trimestre';
            if (periode === 'S1') return '1er semestre';
            if (periode === 'T3') return 'trois premiers trimestres';
            return 'annuel';
        }

        function obtenirActivitesRapport(serviceRapport) {
            var periode = periodeRapportSelectionnee || obtenirPeriodeRapportParDefaut();
            var resultat = [];
            for (var i = 0; i < data.length; i++) {

        function calculerStatsHierarchieRapport(activites) {
            var parSousObjectif = {};
            for (var i = 0; i < activites.length; i++) {
                var h = getHierarchieActivite(activites[i]);
                var cle = h.sousObjectifId || ('objectif-' + h.objectifId);
                if (!parSousObjectif[cle]) {
                    parSousObjectif[cle] = {
                        code: h.sousObjectifCode,
                        nom: h.sousObjectifNom !== '—' ? h.sousObjectifNom : h.objectifNom,
                        planifiees: 0,
                        realisees: 0
                    };
                }
                parSousObjectif[cle].planifiees++;
                if (calculerTauxSuivi(activites[i]) === 100) parSousObjectif[cle].realisees++;
            }
            var resultat = [];
            for (var k in parSousObjectif) {
                var s = parSousObjectif[k];
                s.taux = s.planifiees > 0 ? Math.round((s.realisees / s.planifiees) * 100) : 0;
                resultat.push(s);
            }
            return resultat;
        }

        function calculerStatsHierarchieGroupee(activites) {
            var parObjectif = {};
            for (var i = 0; i < activites.length; i++) {
                var h = getHierarchieActivite(activites[i]);
                var cleObj = h.objectifId || 'sans-objectif';
                if (!parObjectif[cleObj]) {
                    parObjectif[cleObj] = { nom: h.objectifNom, planifiees: 0, realisees: 0, sousObjectifs: {} };
                }
                var realise = calculerTauxSuivi(activites[i]) === 100;
                parObjectif[cleObj].planifiees++;
                if (realise) parObjectif[cleObj].realisees++;

                var cleSO = h.sousObjectifId || ('so-' + cleObj);
                if (!parObjectif[cleObj].sousObjectifs[cleSO]) {
                    parObjectif[cleObj].sousObjectifs[cleSO] = { code: h.sousObjectifCode, nom: h.sousObjectifNom !== '—' ? h.sousObjectifNom : h.objectifNom, planifiees: 0, realisees: 0 };
                }
                parObjectif[cleObj].sousObjectifs[cleSO].planifiees++;
                if (realise) parObjectif[cleObj].sousObjectifs[cleSO].realisees++;
            }

            var resultat = [];
            for (var k in parObjectif) {
                var g = parObjectif[k];
                g.taux = g.planifiees > 0 ? Math.round((g.realisees / g.planifiees) * 100) : 0;
                var liste = [];
                for (var ks in g.sousObjectifs) {
                    var so = g.sousObjectifs[ks];
                    so.taux = so.planifiees > 0 ? Math.round((so.realisees / so.planifiees) * 100) : 0;
                    liste.push(so);
                }
                g.sousObjectifs = liste;
                resultat.push(g);
            }
            return resultat;
        }

        function convertirRomain(n) {
            var chiffres = [['M',1000],['CM',900],['D',500],['CD',400],['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]];
            var reste = n, resultat = '';
            for (var i = 0; i < chiffres.length; i++) {
                while (reste >= chiffres[i][1]) {
                    resultat += chiffres[i][0];
                    reste -= chiffres[i][1];
                }
            }
            return resultat;
        }

        function remplacerVariablesTexte(texte, variables) {
            if (!texte) return '';

            });
        }

        function convertirMarkdownGras(texte) {

        function genererResumeGlobalBilan(donneesGraph, serviceRapport) {
            var cleOverride = 'narratif_global_bilan_' + (serviceRapport || 'global');
            if (rapportTextes[cleOverride] && rapportTextes[cleOverride].trim()) {
                return rapportTextes[cleOverride];
            }

            var totalPlan = 0, totalReal = 0;
            var details = [];
            for (var o = 0; o < donneesGraph.objectifs.length; o++) {
                var pv = donneesGraph.groupes[0].valeurs[o] || 0;
                var rv = donneesGraph.groupes[3].valeurs[o] || 0;
                totalPlan += pv; totalReal += rv;
                if (pv > 0) {
                    var tv = Math.round((rv / pv) * 100);
                    details.push(donneesGraph.objectifs[o].nom + ' (' + rv + ' activités, ' + tv + '%)');
                }
            }
            if (totalPlan === 0) return '';
            var tauxGlobal = Math.round((totalReal / totalPlan) * 100);
            var texte = 'Sur ' + totalPlan + ' activités planifiées, ' + totalReal + ' ont été réalisées, soit un taux d\'exécution de ' + tauxGlobal + '%.';
            if (details.length > 0) {
                texte += ' Répartition par objectif : ' + details.join(', ') + '.';
            }
            return texte;
        }

        function calculerVariablesGlobalesRapport(activitesRapport) {
            var total = activitesRapport.length;
            var realisees = 0;
            for (var i = 0; i < activitesRapport.length; i++) {
                if (calculerTauxSuivi(activitesRapport[i]) === 100) realisees++;
            }
            var taux = total > 0 ? Math.round((realisees / total) * 100) : 0;
            var variables = { total_planifiees: total, total_realisees: realisees, taux_global: taux };

            var objectifsRacine = [];
            for (var i = 0; i < elementsHierarchieData.length; i++) {
                if (!elementsHierarchieData[i].parent_id) objectifsRacine.push(elementsHierarchieData[i]);
            }
            for (var o = 0; o < objectifsRacine.length; o++) {
                var objId = objectifsRacine[o].id;
                var plan = 0, real = 0;
                for (var i = 0; i < activitesRapport.length; i++) {
                    var h = getHierarchieActivite(activitesRapport[i]);
                    if (h.objectifId === objId) {
                        plan++;
                        if (calculerTauxSuivi(activitesRapport[i]) === 100) real++;
                    }
                }
                var tauxObj = plan > 0 ? Math.round((real / plan) * 1000) / 10 : 0;
                var idx = o + 1;
                variables['objectif' + idx + '_nom'] = objectifsRacine[o].nom;
                variables['objectif' + idx + '_planifiees'] = plan;
                variables['objectif' + idx + '_realisees'] = real;
                variables['objectif' + idx + '_taux'] = String(tauxObj).replace('.', ',');
            }

            var sousObjectifsTous = [];
            for (var i = 0; i < elementsHierarchieData.length; i++) {
                if (elementsHierarchieData[i].parent_id) sousObjectifsTous.push(elementsHierarchieData[i]);
            }
            var sansActivite = [];
            for (var s = 0; s < sousObjectifsTous.length; s++) {
                var soId = sousObjectifsTous[s].id;
                var compte = 0;
                for (var i = 0; i < activitesRapport.length; i++) {
                    var h2 = getHierarchieActivite(activitesRapport[i]);
                    if (h2.sousObjectifId === soId) compte++;
                }
                if (compte === 0) sansActivite.push(sousObjectifsTous[s].code || sousObjectifsTous[s].nom);
            }
            variables['sous_objectifs_sans_activite'] = sansActivite.length > 0 ? sansActivite.join(', ') : 'aucun';
            variables['nombre_sous_objectifs_sans_activite'] = sansActivite.length;

            return variables;
        }

        function genererNarratifsObjectifs(activitesRapport, template, serviceRapport) {
            var objectifsRacine = [];
            for (var i = 0; i < elementsHierarchieData.length; i++) {
                if (!elementsHierarchieData[i].parent_id) objectifsRacine.push(elementsHierarchieData[i]);
            }
            var resultat = [];
            for (var o = 0; o < objectifsRacine.length; o++) {
                var objId = objectifsRacine[o].id;
                var nom = objectifsRacine[o].nom;
                var plan = 0, real = 0;
                var compteParSousObjectifPlan = {};
                var compteParSousObjectifReal = {};
                for (var i = 0; i < activitesRapport.length; i++) {
                    var h = getHierarchieActivite(activitesRapport[i]);
                    if (h.objectifId === objId) {
                        plan++;
                        var estRealisee = (calculerTauxSuivi(activitesRapport[i]) === 100);
                        if (estRealisee) real++;
                        if (h.sousObjectifId) {
                            if (!compteParSousObjectifPlan[h.sousObjectifId]) compteParSousObjectifPlan[h.sousObjectifId] = { nom: h.sousObjectifNom, compte: 0 };
                            compteParSousObjectifPlan[h.sousObjectifId].compte++;
                            if (estRealisee) {
                                if (!compteParSousObjectifReal[h.sousObjectifId]) compteParSousObjectifReal[h.sousObjectifId] = { nom: h.sousObjectifNom, compte: 0 };
                                compteParSousObjectifReal[h.sousObjectifId].compte++;
                            }
                        }
                    }
                }
                if (plan === 0) continue;
                var taux = Math.round((real / plan) * 100);

                var sousObjectifPrincipal = '';
                var nbActivitesPrincipal = 0;
                var sourceComptage = (real > 0) ? compteParSousObjectifReal : compteParSousObjectifPlan;
                for (var cleSO in sourceComptage) {
                    if (sourceComptage[cleSO].compte > nbActivitesPrincipal) {
                        nbActivitesPrincipal = sourceComptage[cleSO].compte;
                        sousObjectifPrincipal = sourceComptage[cleSO].nom;
                    }
                }

                var cleOverride = 'narratif_objectif_' + nom + '_' + (serviceRapport || 'global');
                var texte;
                if (rapportTextes[cleOverride] && rapportTextes[cleOverride].trim()) {
                    texte = rapportTextes[cleOverride];
                } else {
                    texte = remplacerVariablesTexte(template, {
                        objectif_nom: nom, nom_objectif: nom,
                        objectif_planifiees: plan, planifiees: plan,
                        objectif_realisees: real, realisees: real,
                        objectif_taux: taux, taux: taux,
                        sous_objectif_principal: sousObjectifPrincipal,
                        nb_activites_principal: nbActivitesPrincipal
                    });
                }
                texte = convertirMarkdownGras(texte);
                resultat.push({ objectifNom: nom, texte: texte });
            }
            return resultat;
        }

        function construireCorpusRapport(activitesRapport, serviceRapport) {
            var morceaux = [];
            for (var s = 0; s < rapportCanevasData.length; s++) {
                var sec = rapportCanevasData[s];
                if (sec.type_section === 'texte_libre') {
                    var cle = 'canevas_' + sec.id + '_' + (serviceRapport || 'global');
                    morceaux.push(rapportTextes[cle] || sec.contenu_defaut || '');
                }
            }
            var suffixeService = '_' + (serviceRapport || 'global');
            for (var k in rapportTextes) {
                if (k.indexOf('narratif_') === 0 && k.slice(-suffixeService.length) === suffixeService) morceaux.push(rapportTextes[k]);
            }
            for (var a = 0; a < activitesRapport.length; a++) {
                morceaux.push(activitesRapport[a].activite || '');
                morceaux.push(activitesRapport[a].commentaire || '');

            return morceaux.join(' \n ');

        function genererSiglesUtilises(corpus) {
            var resultat = [];
            for (var i = 0; i < LISTE_SIGLES_MAITRE.length; i++) {
                var sigle = LISTE_SIGLES_MAITRE[i];
                var motEchappe = sigle.code.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                var regex = new RegExp('(^|[^A-Za-zÀ-ÿ0-9])' + motEchappe + '([^A-Za-zÀ-ÿ0-9]|$)');
                if (regex.test(corpus)) resultat.push(sigle);
            }
            resultat.sort(function(a, b) { return a.code.localeCompare(b.code); });
            return resultat;

        function calculerCelluleMixte(col, ligne) {
            var num = parseFloat(ligne[col.num]);
            var denom = parseFloat(ligne[col.denom]);
            if (isNaN(num)) num = 0;
            if (isNaN(denom)) denom = 0;

            if (col.formule === 'pourcentage') {
                return denom > 0 ? Math.round((num / denom) * 100) + '%' : '—';
            }
            if (col.formule === 'variation') {
                return (num - denom);
            }
            if (col.formule === 'taux_variation') {
                return denom > 0 ? Math.round(((num - denom) / denom) * 100) + '%' : '—';
            }
            if (col.formule === 'appreciation') {
                var taux = denom > 0 ? (num / denom) * 100 : 0;
                if (taux >= 90) return 'Très satisfaisant';
                if (taux >= 50) return 'Satisfaisant';
                return 'Insuffisant';
            }
            return '';
        }

var rappelsActifs = [];
var rappelsVus = false;
var DELAI_ALERTE_INACTIVITE_JOURS = 21;

function obtenirTrimestreActuel() {
    var mois = new Date().getMonth() + 1;
    if (mois <= 3) return 1;
    if (mois <= 6) return 2;
    if (mois <= 9) return 3;
    return 4;
}

function obtenirDernierTrimestrePlanifie(activite) {
    if (activite.t4) return 4;
    if (activite.t3) return 3;
    if (activite.t2) return 2;
    if (activite.t1) return 1;
    return 0;
}

function calculerRappels() {
    rappelsActifs = [];
    rappelsVus = false;
    if (!currentUser) return;

    var trimestreActuel = obtenirTrimestreActuel();
    var maintenant = new Date();

    for (var i = 0; i < data.length; i++) {
        var d = data[i];
        if (!d.valide) continue;
        if (currentUser.role === 'chef' && d.service !== currentUser.service) continue;
        if (calculerTauxSuivi(d) === 100) continue;

        var raisons = [];

        if (d.derniere_maj) {
            var joursEcoules = Math.floor((maintenant - new Date(d.derniere_maj)) / (1000 * 60 * 60 * 24));
            if (joursEcoules >= DELAI_ALERTE_INACTIVITE_JOURS) {
                raisons.push('Non mise à jour depuis ' + joursEcoules + ' jours');
            }
        }

        var dernierTrimestre = obtenirDernierTrimestrePlanifie(d);
        if (dernierTrimestre > 0 && dernierTrimestre < trimestreActuel) {
            raisons.push('Échéance dépassée (prévue T' + dernierTrimestre + ', on est en T' + trimestreActuel + ')');
        }

        if (raisons.length > 0) {
            rappelsActifs.push({ activite: d, raisons: raisons });
        }
    }
}

            await supabase.from('tentatives_connexion').insert({ email: email, succes: !(authError || !authData.user) });
        } catch (logError) {
            console.error('Erreur enregistrement tentative connexion:', logError);
        }

        if (authError || !authData.user) {
            alert('Identifiants incorrects');
            return;
        }

        const { data: profil, error: profilError } = await supabase
            .from('profiles')
            .select('*')
            .eq('email', email)
            .single();

        if (profilError || !profil) {
            alert('Ce compte n\'est pas encore configuré dans l\'application. Contactez l\'administrateur.');
            await supabase.auth.signOut();
            return;
        }

        if (profil.actif === false) {
            alert('Ce compte est désactivé');
            await supabase.auth.signOut();
            return;
        }

        // 🔒 Verrouillage par appareil
        var monAppareilId = obtenirIdentifiantAppareil();
        var monAppareilLibelle = obtenirLibelleAppareil();

        if (!profil.appareil_id) {
            // Premier appareil utilisé pour ce compte : on l'associe.
            const { error: erreurAppareil } = await supabase
                .from('profiles')
                .update({ appareil_id: monAppareilId, appareil_libelle: monAppareilLibelle })
                .eq('email', email)
                .is('appareil_id', null);
            if (!erreurAppareil) {
                profil.appareil_id = monAppareilId;
                profil.appareil_libelle = monAppareilLibelle;
            }
        } else if (profil.appareil_id !== monAppareilId && profil.role !== 'admin') {
            alert('Ce compte est déjà utilisé sur un autre appareil (' + (profil.appareil_libelle || 'appareil inconnu') + '). Contactez l\'administrateur pour autoriser ce changement.');
            await supabase.auth.signOut();
            return;
        }

        // Connexion réussie
        currentUser = {
            user: email.split('@')[0],
            email: email,
            role: profil.role,
            nom: profil.nom,
            service: profil.service,
            actif: profil.actif,
            motDePasseChange: profil.mot_de_passe_change === true,
            derniereLectureDocPartages: profil.derniere_lecture_documents_partages || null
        };

        // 🔥 On recharge TOUT maintenant que la session est authentifiée.
        // (Le premier chargement, fait avant la connexion, s'est produit
        // sans authentification et peut donc être incomplet à cause de
        // la sécurité RLS — on ne peut pas se contenter de ces données.)
        await loadData();
        await loadPermissions();
        await loadHierarchieData(hierarchieAnneeSelectionnee);
        await chargerTypesMarche();
        await loadChampsActiviteEtValeurs(hierarchieAnneeSelectionnee);
        await chargerRapportCanevas(hierarchieAnneeSelectionnee);

        await loadRapportTextes();
        await enregistrerPresence();
        if (currentUser.role === 'admin' || currentUser.role === 'chefdept') {
            await chargerUtilisateursConnectes();
        }
        calculerRappels();
        
        var alreadyConnected = false;
        for (var i = 0; i < connectedUsers.length; i++) {
            if (connectedUsers[i].user === currentUser.user) {
                alreadyConnected = true;
                connectedUsers[i].connectedAt = new Date().toLocaleString('fr-FR');
                break;
            }
        }
        if (!alreadyConnected) {
            connectedUsers.push({
                user: currentUser.user,
                nom: currentUser.nom,
                service: currentUser.service,
                connectedAt: new Date().toLocaleString('fr-FR')
            });
        }
        localStorage.setItem('connectedUsers', JSON.stringify(connectedUsers));
        
        render();
    } catch (error) {
        console.error('Erreur login:', error);
        alert('Erreur de connexion');
    }
}

async function submitChangePassword() {
    var oldPassword = document.getElementById('old-password').value;
    var newPassword = document.getElementById('new-password').value;
    var confirmPassword = document.getElementById('confirm-password').value;
    
    if (!oldPassword || !newPassword || !confirmPassword) {
        alert('Veuillez remplir tous les champs');
        return;
    }
    
    if (newPassword.length < 8) {
        alert('Le nouveau mot de passe doit contenir au moins 8 caractères');
        return;
    }
    
    if (newPassword !== confirmPassword) {
        alert('Les mots de passe ne correspondent pas');
        return;
    }
    
    try {
        // Vérifier l'ancien mot de passe en tentant une ré-authentification
        const { error: verifError } = await supabase.auth.signInWithPassword({ email: currentUser.email, password: oldPassword });
        if (verifError) {
            alert('Ancien mot de passe incorrect');
            return;
        }

        const { error } = await supabase.auth.updateUser({ password: newPassword });
        if (error) throw error;

        if (currentUser.role !== 'admin') {
            await supabase.from('profiles').update({ mot_de_passe_change: true }).eq('email', currentUser.email);
            currentUser.motDePasseChange = true;
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === currentUser.email) { users[i].motDePasseChange = true; break; }
            }
        }
        
        alert('Mot de passe changé avec succès !');
        closeModal();
    } catch (error) {
        console.error('Erreur changement mot de passe:', error);
        alert('Erreur lors du changement de mot de passe');
    }
}

        async function submitEditActivity() {
    if (!activiteEnEditionId) return;

    var ancienneActivite = null;
    for (var iOld = 0; iOld < data.length; iOld++) {
        if (data[iOld].id === activiteEnEditionId) { ancienneActivite = Object.assign({}, data[iOld]); break; }
    }

    var activite = document.getElementById('new-activite').value.trim();
    var service = document.getElementById('new-service').value;

    if (currentUser.role === 'chef' && service !== currentUser.service) {
        alert('❌ Vous ne pouvez modifier que pour votre service');
        return;
    }

    if (!activite) {
        alert('Veuillez remplir l\'activité');
        return;
    }

    var profondeurMax = 0;
    for (var p in activiteFormSelections) {
        if (parseInt(p) > profondeurMax) profondeurMax = parseInt(p);
    }
    var elementHierarchieId = profondeurMax > 0 ? parseInt(activiteFormSelections[profondeurMax]) : null;

    if (!elementHierarchieId) {
        alert('⚠️ Veuillez sélectionner au moins le premier niveau de l\'objectif');
        return;
    }

    var updateActivite = {
        element_hierarchie_id: elementHierarchieId,
        activite: activite,
        service: service,
        derniere_maj: new Date().toISOString(),
        maj_par: currentUser.nom
    };

    if (currentUser.role === 'admin') {
        var codeInput = document.getElementById('edit-activite-code');
        if (codeInput) {
            var nouveauCode = codeInput.value.trim();
            if (!nouveauCode) {
                alert('Le code ne peut pas être vide');
                return;
            }
            updateActivite.code = nouveauCode;
        }
    }

    try {
        const { data: updatedData, error } = await supabase
            .from('activites')
            .update(updateActivite)
            .eq('id', activiteEnEditionId)
            .select();

        if (error) throw error;

        if (ancienneActivite) {
            var dateActionHistorique = new Date().toISOString();
            if (ancienneActivite.activite !== activite) enregistrerHistorique(activiteEnEditionId, 'activite', ancienneActivite.activite, activite, dateActionHistorique);
            if (ancienneActivite.service !== service) enregistrerHistorique(activiteEnEditionId, 'service', ancienneActivite.service, service, dateActionHistorique);
            if (updateActivite.code && ancienneActivite.code !== updateActivite.code) enregistrerHistorique(activiteEnEditionId, 'code', ancienneActivite.code, updateActivite.code, dateActionHistorique);
        }

        if (updatedData && updatedData.length > 0) {
            for (var i = 0; i < data.length; i++) {
                if (data[i].id === activiteEnEditionId) { data[i] = updatedData[0]; break; }
            }
        }

        for (var i = 0; i < champsActiviteConfigData.length; i++) {
            var champ = champsActiviteConfigData[i];
            var inputEl = document.getElementById('new-champ-' + champ.id);
            var valeur = inputEl ? inputEl.value.trim() : '';

            var ligneExistante = null;
            for (var j = 0; j < valeursChampsActiviteData.length; j++) {
                if (valeursChampsActiviteData[j].activite_id === activiteEnEditionId && valeursChampsActiviteData[j].champ_id === champ.id) {
                    ligneExistante = valeursChampsActiviteData[j];
                    break;
                }
            }

            if (ligneExistante) {
                const { error: errMaj } = await supabase
                    .from('valeurs_champs_activite')
                    .update({ valeur: valeur })
                    .eq('id', ligneExistante.id);
                if (errMaj) { console.error('Erreur mise à jour champ:', errMaj); }
                else { ligneExistante.valeur = valeur; }
            } else if (valeur) {
                const { data: nouvelleValeur, error: errAjout } = await supabase
                    .from('valeurs_champs_activite')
                    .insert({ activite_id: activiteEnEditionId, champ_id: champ.id, valeur: valeur })
                    .select();
                if (errAjout) { console.error('Erreur ajout champ:', errAjout); }
                else if (nouvelleValeur && nouvelleValeur.length > 0) { valeursChampsActiviteData.push(nouvelleValeur[0]); }
            }
        }

        alert('✅ Activité modifiée avec succès !');
        activiteEnEditionId = null;
        closeModal();
        render();
    } catch (error) {
        console.error('Erreur modification activité:', error);
        alert('❌ Erreur lors de la modification : ' + error.message);
    }
}
        function getFilteredDataForSuivi() {

                    else if (suiviTrimestreFilter === 'T4' && (baseData[i].t1 || baseData[i].t2 || baseData[i].t3 || baseData[i].t4)) programmee = true;
                    if (programmee) trimestreFiltered.push(baseData[i]);
                }
                baseData = trimestreFiltered;
            }

                }

            }
            
            if (suiviEtatFilter !== 'TOUS') {

                for (var i = 0; i < baseData.length; i++) {
                    var t = calculerTauxSuivi(baseData[i]);

                    if (col.type === 'manuel' && col.id !== configExport.colonnes[0].id && !isNaN(parseFloat(valeur))) {
                        totauxExport[col.id] = (totauxExport[col.id] || 0) + parseFloat(valeur);
                    }
                    html += '<td' + (c === 0 ? '' : ' style="text-align:center;"') + '>' + (valeur !== '' ? valeur : '—') + '</td>';
                }
                html += '</tr>';
            }
            if (configExport.ligne_total) {
                html += '<tr class="total"><td>Total</td>';
                for (var c = 1; c < configExport.colonnes.length; c++) {
                    var col = configExport.colonnes[c];
                    if (col.type === 'calcule') {
                        var fictive = {}; fictive[col.num] = totauxExport[col.num] || 0; fictive[col.denom] = totauxExport[col.denom] || 0;
                        html += '<td style="text-align:center;">' + calculerCelluleMixte(col, fictive) + '</td>';
                    } else {
                        html += '<td style="text-align:center;">' + (totauxExport[col.id] !== undefined ? totauxExport[col.id] : '') + '</td>';
                    }
                }
                html += '</tr>';
            }
            html += '</tbody></table>';

        } else if (section.type_section === 'liste_non_realisees') {
            var nonRealiseesExport = obtenirActivitesNonRealiseesAnnee(serviceRapport);
            if (nonRealiseesExport.length > 0) {
                for (var nr = 0; nr < nonRealiseesExport.length; nr++) {
                    html += '<p class="activite-item">• ' + (nonRealiseesExport[nr].code || '') + ' ' + nonRealiseesExport[nr].activite + ' (' + calculerTauxSuivi(nonRealiseesExport[nr]) + '%)</p>';
                }
            } else {
                html += '<p style="color:#6b7280; font-style:italic;">Toutes les activités de l\'année sont réalisées à 100%.</p>';
            }

        } else if (section.type_section === 'liste_sigles') {
            var corpusSiglesExport = construireCorpusRapport(activitesRapport, serviceRapport);
            var siglesUtilisesExport = genererSiglesUtilises(corpusSiglesExport);
            for (var si = 0; si < siglesUtilisesExport.length; si++) {
                html += '<p style="margin:2px 0; text-align:left;"><strong>' + siglesUtilisesExport[si].code + '</strong> : ' + siglesUtilisesExport[si].def + '</p>';
            }

        } else if (section.type_section === 'liste_tableaux') {
            var tableauxListeExport = genererListeTableaux();
            for (var ti = 0; ti < tableauxListeExport.length; ti++) {
                html += '<p style="margin:2px 0;">Tableau ' + tableauxListeExport[ti].numero + ' : ' + tableauxListeExport[ti].titre + '</p>';
            }

        } else if (section.type_section === 'liste_activites') {
            var activitesRealisees100Export = [];
            for (var are = 0; are < activitesRapport.length; are++) {
                if (calculerTauxSuivi(activitesRapport[are]) === 100) activitesRealisees100Export.push(activitesRapport[are]);
            }

            if (activitesRealisees100Export.length > 0) {
                var activitesTrieesExport = activitesRealisees100Export.slice();
                activitesTrieesExport.sort(function(a, b) {
                    var ha = getHierarchieActivite(a), hb = getHierarchieActivite(b);
                    if (ha.objectifOrdre !== hb.objectifOrdre) return ha.objectifOrdre - hb.objectifOrdre;
                    if (ha.sousObjectifOrdre !== hb.sousObjectifOrdre) return ha.sousObjectifOrdre - hb.sousObjectifOrdre;
                    return comparerCodesActivite(a.code, b.code);
                });

                var templateNarratifListeExport = '';
                for (var tne = 0; tne < rapportCanevasData.length; tne++) {
                    if (rapportCanevasData[tne].type_section === 'narratif_hierarchie') { templateNarratifListeExport = rapportCanevasData[tne].contenu_defaut || ''; break; }
                }
                var narratifsListeExport = genererNarratifsObjectifs(activitesRapport, templateNarratifListeExport, serviceRapport);
                var graphiquesParObjectifListeExport = calculerGraphiquesParSousObjectif(activitesRapport);
                var compteurGraphiqueListeExport = 2;

                var dernierObjectifExport = null;
                var dernierSousObjectifExport = null;
                for (var a = 0; a < activitesTrieesExport.length; a++) {
                    var da = activitesTrieesExport[a];
                    var hExport = getHierarchieActivite(da);

                    if (hExport.objectifId !== dernierObjectifExport) {
                        html += '<h3>' + hExport.objectifNom + '</h3>';
                        dernierObjectifExport = hExport.objectifId;
                        dernierSousObjectifExport = null;

                        var narratifCorrespondantExport = null;
                        for (var nle = 0; nle < narratifsListeExport.length; nle++) {
                            if (narratifsListeExport[nle].objectifNom === hExport.objectifNom) { narratifCorrespondantExport = narratifsListeExport[nle]; break; }
                        }
                        if (narratifCorrespondantExport && narratifCorrespondantExport.texte) {
                            html += '<p>' + narratifCorrespondantExport.texte + '</p>';
                        }

                        var graphObjListeExport = null;
                        for (var gde = 0; gde < graphiquesParObjectifListeExport.length; gde++) {
                            if (graphiquesParObjectifListeExport[gde].nom === hExport.objectifNom) { graphObjListeExport = graphiquesParObjectifListeExport[gde]; break; }
                        }
                        if (graphObjListeExport) {
                            html += '<h3>Graphique ' + compteurGraphiqueListeExport + '</h3>';
                            compteurGraphiqueListeExport++;
                            html += '<table><thead><tr><th></th><th>Taux</th></tr></thead><tbody>';
                            for (var so = 0; so < graphObjListeExport.sousObjectifs.length; so++) {
                                var ssoNExport = graphObjListeExport.sousObjectifs[so];
                                html += '<tr><td>' + ssoNExport.nom + '</td><td style="text-align:center;">' + ssoNExport.taux + '%</td></tr>';
                            }
                            html += '</tbody></table>';
                        }
                    }

                    if (hExport.sousObjectifId !== dernierSousObjectifExport) {
                        html += '<p style="font-weight:bold; color:#059669; margin:6px 0 4px 0; text-align:left;">' + (hExport.sousObjectifCode ? hExport.sousObjectifCode + ' ' : '') + hExport.sousObjectifNom + '</p>';
                        var cleParagrapheSOExport = 'narratif_sousobjectif_' + hExport.sousObjectifCode + '_' + (serviceRapport || 'global');
                        if (rapportTextes[cleParagrapheSOExport] && rapportTextes[cleParagrapheSOExport].trim()) {
                            html += '<p>' + convertirMarkdownGras(rapportTextes[cleParagrapheSOExport]) + '</p>';
                        }
                        dernierSousObjectifExport = hExport.sousObjectifId;
                    }

                    html += '<p class="activite-item" style="text-align:left; margin-bottom:2px;"><strong>' + (da.code ? da.code + ' ' : '') + da.activite + '</strong></p>';
                    if (da.commentaire) {
                        html += '<p class="activite-item">' + da.commentaire + '</p>';
                    }
                }
            } else {
                html += '<p style="color:#6b7280; font-style:italic;">Aucune activité à afficher.</p>';
            }
        }
    }

    html += '</div></body></html>';

    var blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'Rapport_Performance_' + hierarchieAnneeSelectionnee + '_' + new Date().getTime() + '.doc';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

        async function createNewUser() {
            var email = document.getElementById('new-email').value.trim().toLowerCase();
            var fullname = document.getElementById('new-fullname').value.trim();
            var role = document.getElementById('new-role').value;
            var service = document.getElementById('new-service').value;
            
            if (!email || !fullname) {
                alert('Veuillez remplir tous les champs');
                return;
            }
            
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === email) {
                    alert('Un profil existe déjà pour cet email');
                    return;
                }
            }
            
            try {
                const { error } = await supabase.from('profiles').insert({
                    email: email,
                    nom: fullname,
                    role: role,
                    service: service,
                    actif: true
                });
                if (error) throw error;

                users.push({ email: email, user: email.split('@')[0], role: role, nom: fullname, service: service, actif: true });
                alert('Compte créé avec succès. La personne peut se connecter avec cet email et le mot de passe défini dans Supabase.');
                showUserList();
            } catch (error) {
                console.error('Erreur createNewUser:', error);
                alert('❌ Erreur lors de la création du compte');
            }
        }

        async function reautoriserChangementMotDePasse(userEmail) {
            try {
                const { error } = await supabase.from('profiles').update({ mot_de_passe_change: false }).eq('email', userEmail);
                if (error) throw error;
                for (var i = 0; i < users.length; i++) {
                    if (users[i].email === userEmail) { users[i].motDePasseChange = false; break; }
                }
                alert('Cette personne peut maintenant changer son mot de passe une nouvelle fois.');
                showEditUserForm(userEmail);

                console.error('Erreur reautoriserChangementMotDePasse:', error);
                alert('❌ Erreur');
            }

        async function updateUser(userEmail) {
            var fullname = document.getElementById('edit-fullname').value.trim();
            var service = document.getElementById('edit-service').value;
            
            if (!fullname) {
                alert('Veuillez remplir le nom complet');
                return;
            }
            
            try {
                const { error } = await supabase.from('profiles').update({ nom: fullname, service: service }).eq('email', userEmail);
                if (error) throw error;

                for (var i = 0; i < users.length; i++) {
                    if (users[i].email === userEmail) {
                        users[i].nom = fullname;
                        users[i].service = service;
                        break;
                    }
                }
                alert('Compte modifié avec succès');
                showUserList();
            } catch (error) {
                console.error('Erreur updateUser:', error);
                alert('❌ Erreur lors de la modification du compte');
            }
        }

        async function toggleUserStatus(userEmail) {
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === userEmail) {
                    var nouveauStatut = !users[i].actif;
                    try {
                        const { error } = await supabase.from('profiles').update({ actif: nouveauStatut }).eq('email', userEmail);
                        if (error) throw error;
                        users[i].actif = nouveauStatut;
                        showUserList();
                    } catch (error) {
                        console.error('Erreur toggleUserStatus:', error);
                        alert('❌ Erreur lors du changement de statut');
                    }
                    return;
                }
            }
        }

        async function confirmDeleteUser(userEmail) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce compte ? Pensez aussi à supprimer son accès dans le tableau de bord Supabase (Authentication) pour empêcher toute future connexion.')) return;
            
            try {
                const { error } = await supabase.from('profiles').delete().eq('email', userEmail);
                if (error) throw error;

                var newUsers = [];
                for (var i = 0; i < users.length; i++) {
                    if (users[i].email !== userEmail) newUsers.push(users[i]);
                }
                users = newUsers;
                alert('Profil supprimé de l\'application');
                showUserList();
            } catch (error) {
                console.error('Erreur confirmDeleteUser:', error);
                alert('❌ Erreur lors de la suppression du compte');
            }
        }

function genererEnteteRedimensionnable(id, label, largeurInitiale, titreInfobulle) {
    var attrTitre = titreInfobulle ? (' title="' + titreInfobulle + '"') : '';
    return '<th id="th-' + id + '"' + attrTitre + ' style="border:1px solid #e5e7eb; padding:6px; position:relative; width:' + largeurInitiale + 'px; overflow:hidden;">' +
        '<span>' + label + '</span>' +
        '<div onmousedown="demarrerRedimensionnementColonne(event, \'th-' + id + '\')" style="position:absolute; top:0; right:0; width:8px; height:100%; cursor:col-resize; user-select:none;"></div></th>';
}

var redimensionnementColonneEnCours = null;

function demarrerRedimensionnementColonne(event, thId) {
    event.preventDefault();
    event.stopPropagation();
    var th = document.getElementById(thId);
    if (!th) return;
    redimensionnementColonneEnCours = { th: th, startX: event.clientX, startWidth: th.offsetWidth };
    document.addEventListener('mousemove', gererRedimensionnementColonne);
    document.addEventListener('mouseup', arreterRedimensionnementColonne);
}

function gererRedimensionnementColonne(event) {
    if (!redimensionnementColonneEnCours) return;
    var delta = event.clientX - redimensionnementColonneEnCours.startX;
    var nouvelleLargeur = Math.max(40, redimensionnementColonneEnCours.startWidth + delta);
    redimensionnementColonneEnCours.th.style.width = nouvelleLargeur + 'px';
}

function arreterRedimensionnementColonne() {
    redimensionnementColonneEnCours = null;
    document.removeEventListener('mousemove', gererRedimensionnementColonne);
    document.removeEventListener('mouseup', arreterRedimensionnementColonne);
}

async function ajouterSectionCanevas() {

async function enregistrerLargeursColonnes(sectionId, nbColonnes) {
    var section = null;
    for (var i = 0; i < canevasAdminListe.length; i++) { if (canevasAdminListe[i].id === sectionId) { section = canevasAdminListe[i]; break; } }
    if (!section) return;

    var config;
    try { config = JSON.parse(section.contenu_defaut); } catch (e) { alert('❌ JSON invalide, impossible de mettre à jour'); return; }

    for (var ci = 0; ci < nbColonnes; ci++) {
        var champLargeur = document.getElementById('largeur-col-' + ci);
        var valeur = champLargeur.value.trim();
        if (valeur === '') {
            delete config.colonnes[ci].largeur;
        } else {
            config.colonnes[ci].largeur = parseInt(valeur);
        }
    }

    try {
        const { error } = await supabase.from('rapport_canevas').update({ contenu_defaut: JSON.stringify(config) }).eq('id', sectionId);
        if (error) throw error;
        await chargerRapportCanevas(hierarchieAnneeSelectionnee);
        modifierContenuSectionCanevas(sectionId);
    } catch (error) {
        alert('❌ Erreur : ' + error.message);
    }
}

    var html = '<table style="width:100%; border-collapse:collapse; font-size:12px;"><thead class="blue"><tr>';

        compteur++;

        var codeActivite = '';

        }

        html += '<tr style="' + (!h.lu ? 'background-color:#fef2f2;' : '') + '">';

        html += '</tr>';
    }

    }
    html += '</tbody></table>';
    conteneur.innerHTML = html;
}

function obtenirDateSeule(dateISO) {
    return new Date(dateISO).toLocaleDateString('fr-FR');
}

async function marquerHistoriqueLu(id, lu) {
    var ligneReference = null;
    for (var i = 0; i < historiqueModificationsData.length; i++) {
        if (historiqueModificationsData[i].id === id) { ligneReference = historiqueModificationsData[i]; break; }
    }
    if (!ligneReference) return;

    var dateReference = obtenirDateSeule(ligneReference.date_modification);
    var idsAMarquer = [];
    for (var i = 0; i < historiqueModificationsData.length; i++) {
        if (obtenirDateSeule(historiqueModificationsData[i].date_modification) === dateReference) {
            idsAMarquer.push(historiqueModificationsData[i].id);
        }
    }

    try {
        const { error } = await supabase.from('historique_modifications').update({ lu: lu }).in('id', idsAMarquer);

var MAPPING_ACTEUR_SERVICES = {
    'PRMP': ['PRMP'],
    'CF & DAF': ['CF', 'DAF']
};

function peutModifierTypeMarcheSuivi(activite) {
    if (!currentUser) return false;
    if (currentUser.role === 'admin') return true;
    if (currentUser.role === 'chef') return activite.service === currentUser.service;
    return false;
}

function peutModifierActeurSuivi(activite, acteur) {
    if (!currentUser) return false;
    if (currentUser.role === 'admin') return true;
    if (currentUser.role !== 'chef') return false;

    if (acteur === 'Service porteur') {
        return activite.service === currentUser.service;
    }
    var servicesAssocies = MAPPING_ACTEUR_SERVICES[acteur];
    if (servicesAssocies) {
        return servicesAssocies.indexOf(currentUser.service) !== -1;
    }
    return false; // ex. Trésor Public : aucun service ne correspond pour l'instant
}

var ACTEURS_SUIVI = ['Service porteur', 'PRMP', 'CF & DAF', 'Trésor Public'];

function rolesPourActeur(typeMarche, acteur) {
    var resultat = [];

        var r = rolesMarchesData[i];

}

function calculerTauxSuivi(activite) {
    if (!activite.type_marche) return 0;
    var atteints = activite.roles_atteints || {};
    var totalMax = 0;
    var totalAtteint = 0;
    for (var i = 0; i < ACTEURS_SUIVI.length; i++) {
        var acteur = ACTEURS_SUIVI[i];
        var roles = rolesPourActeur(activite.type_marche, acteur);
        if (roles.length === 0) continue;
        var maxOrdre = roles[roles.length - 1].ordre;
        totalMax += maxOrdre;
        totalAtteint += (atteints[acteur] || 0);
    }
    if (totalMax === 0) return 0;
    return Math.round((totalAtteint / totalMax) * 100);
}

async function updateTypeMarcheActivite(activityId, nouveauType) {
    var activite = null;
    for (var i = 0; i < data.length; i++) {
        if (data[i].id === activityId) { activite = data[i]; break; }
    }
    if (!activite) return;

    if (!peutModifierTypeMarcheSuivi(activite)) {
        alert('❌ Vous ne pouvez pas modifier le type de marché de cette activité');
        return;
    }

    var ancienType = activite.type_marche;

    try {
        const { error } = await supabase
            .from('activites')
            .update({ type_marche: nouveauType || null, roles_atteints: null })
            .eq('id', activityId);
        if (error) throw error;

        enregistrerHistorique(activityId, 'type_marche', ancienType, nouveauType || null);

        activite.type_marche = nouveauType || null;
        activite.roles_atteints = null;
        render();
    } catch (error) {
        console.error('Erreur changement type de marché:', error);
        alert('❌ Erreur : ' + error.message);
    }
}

async function updateRoleActeur(activityId, acteur, nouvelOrdre) {
    var activite = null;
    for (var i = 0; i < data.length; i++) {
        if (data[i].id === activityId) { activite = data[i]; break; }
    }
    if (!activite) return;

    if (!peutModifierActeurSuivi(activite, acteur)) {
        alert('❌ Vous ne pouvez modifier que le rôle qui correspond à votre propre service');
        return;
    }

    var ancienOrdreActeur = (activite.roles_atteints && activite.roles_atteints[acteur] !== undefined) ? activite.roles_atteints[acteur] : 0;
    var atteints = activite.roles_atteints ? Object.assign({}, activite.roles_atteints) : {};
    atteints[acteur] = parseInt(nouvelOrdre) || 0;

    try {
        const { error } = await supabase
            .from('activites')
            .update({ roles_atteints: atteints, derniere_maj: new Date().toISOString(), maj_par: currentUser.nom })
            .eq('id', activityId);
        if (error) throw error;

        enregistrerHistorique(activityId, 'role_' + acteur, ancienOrdreActeur, atteints[acteur]);

        activite.roles_atteints = atteints;
        render();
    } catch (error) {
        console.error('Erreur mise à jour rôle:', error);
        alert('❌ Erreur : ' + error.message);
    }
}

function getRolesPourActeur(typeMarche, acteur) {
    var resultat = [];
    for (var i = 0; i < rolesMarchesData.length; i++) {
        var r = rolesMarchesData[i];
        if (r.type_marche === typeMarche && r.acteur === acteur) resultat.push(r);
    }
    resultat.sort(function(a, b) { return a.ordre - b.ordre; });
    return resultat;
}

function getActeursDisponibles(typeMarche) {
    var vus = {};
    var liste = [];
    for (var i = 0; i < rolesMarchesData.length; i++) {
        if (rolesMarchesData[i].type_marche === typeMarche && !vus[rolesMarchesData[i].acteur]) {
            vus[rolesMarchesData[i].acteur] = true;
            liste.push(rolesMarchesData[i].acteur);
        }
    }
    return liste;
}

function calculerTauxSuivi(activite) {
    if (!activite.type_marche) return 0;
    var acteurs = getActeursDisponibles(activite.type_marche);
    if (acteurs.length === 0) return 0;

    var rolesAtteints = activite.roles_atteints || {};
    var totalPossible = 0;
    var totalAtteint = 0;

    for (var i = 0; i < acteurs.length; i++) {
        var rolesActeur = getRolesPourActeur(activite.type_marche, acteurs[i]);
        var maxOrdre = rolesActeur.length > 0 ? rolesActeur[rolesActeur.length - 1].ordre : 0;
        totalPossible += maxOrdre;
        totalAtteint += (rolesAtteints[acteurs[i]] || 0);
    }

    if (totalPossible === 0) return 0;
    return Math.round((totalAtteint / totalPossible) * 100);
}


function libelleHierarchieActivite(activite) {
    if (!activite.element_hierarchie_id) return '<span style="color:#9ca3af;">Non classé</span>';
    var el = null;
    for (var i = 0; i < elementsHierarchieData.length; i++) {
        if (elementsHierarchieData[i].id === activite.element_hierarchie_id) { el = elementsHierarchieData[i]; break; }
    }
    if (!el) return '<span style="color:#9ca3af;">Non classé</span>';

    var chemin = [el.nom];
    var courant = el;
    var securite = 0;
    while (courant.parent_id && securite < 10) {
        var parent = null;
        for (var j = 0; j < elementsHierarchieData.length; j++) {
            if (elementsHierarchieData[j].id === courant.parent_id) { parent = elementsHierarchieData[j]; break; }
        }
        if (!parent) break;
        chemin.unshift(parent.nom);
        courant = parent;
        securite++;
    }

    var titre = chemin.join(' > ').replace(/"/g, '&quot;');
    return '<span class="badge badge-blue" title="' + titre + '">' + (el.code || el.nom) + '</span>';
}

function rendreGraphiqueBarresVerticales(donnees, suffixe, maxFixe) {
    if (!donnees || donnees.length === 0) return '<p class="empty-state">Aucune donnée à représenter</p>';
    var maxVal = maxFixe || 0;
    if (!maxFixe) {
        for (var i = 0; i < donnees.length; i++) { if (donnees[i].valeur > maxVal) maxVal = donnees[i].valeur; }
    }
    if (maxVal === 0) maxVal = 1;
    var hauteurMax = 220;
    suffixe = suffixe || '';

    var frag = '<div style="display:flex; align-items:flex-start; justify-content:space-around; width:100%; box-sizing:border-box; gap:10px; padding:20px 24px 12px 24px; background-color:#f9fafb; border-radius:8px; overflow-x:auto;">';
    for (var i = 0; i < donnees.length; i++) {
        var d = donnees[i];
        var h = Math.max(4, Math.round((d.valeur / maxVal) * hauteurMax));
        frag += '<div style="display:flex; flex-direction:column; align-items:center; flex:1; min-width:60px;">';
        frag += '<div style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:' + hauteurMax + 'px;">';
        frag += '<div style="font-size:12px; font-weight:700; color:#374151; margin-bottom:4px;">' + d.valeur + suffixe + '</div>';
        frag += '<div style="width:42px; height:' + h + 'px; background-color:' + (d.couleur || '#1E4E8C') + '; border-radius:4px 4px 0 0;"></div>';
        frag += '</div>';
        frag += '<div style="font-size:11px; color:#6b7280; text-align:center; margin-top:6px; max-width:100px; line-height:1.3;">' + d.label + '</div>';
        frag += '</div>';
    }
    frag += '</div>';
    return frag;
}

function rendreGraphiqueBarresGroupees(categories, series) {
    if (!categories || categories.length === 0) return '<p class="empty-state">Aucune donnée à représenter</p>';
    var maxVal = 0;
    for (var s = 0; s < series.length; s++) {
        if (series[s].estPourcentage) continue;
        for (var i = 0; i < series[s].valeurs.length; i++) { if (series[s].valeurs[i] > maxVal) maxVal = series[s].valeurs[i]; }
    }
    if (maxVal === 0) maxVal = 1;
    var hauteurMax = 220;

    var frag = '<div style="display:flex; gap:16px; margin-top:16px; margin-bottom:14px; flex-wrap:wrap;">';
    for (var s = 0; s < series.length; s++) {
        frag += '<div style="display:flex; align-items:center; gap:6px; font-size:11px; color:#374151;"><span style="width:12px; height:12px; border-radius:2px; background-color:' + series[s].couleur + '; display:inline-block;"></span>' + series[s].nom + '</div>';
    }
    frag += '</div>';

    frag += '<div style="display:flex; align-items:flex-start; justify-content:space-around; width:100%; box-sizing:border-box; gap:10px; padding:16px 24px; background-color:#f9fafb; border-radius:8px; overflow-x:auto;">';
    for (var c = 0; c < categories.length; c++) {
        frag += '<div style="display:flex; flex-direction:column; align-items:center; flex:1; min-width:80px;">';
        frag += '<div style="display:flex; align-items:flex-end; gap:6px; height:' + hauteurMax + 'px;">';
        for (var s = 0; s < series.length; s++) {
            var val = series[s].valeurs[c] || 0;
            var echelle = series[s].estPourcentage ? 100 : maxVal;
            var h = Math.max(2, Math.round((val / echelle) * hauteurMax));
            frag += '<div style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;">';
            frag += '<span style="font-size:10px; font-weight:700; color:#374151; margin-bottom:2px;">' + val + (series[s].estPourcentage ? '%' : '') + '</span>';
            frag += '<div style="width:26px; height:' + h + 'px; background-color:' + series[s].couleur + '; border-radius:2px 2px 0 0;"></div>';
            frag += '</div>';
        }
        frag += '</div>';
        frag += '<div style="font-size:11px; color:#6b7280; margin-top:6px; text-align:center; max-width:100px;">' + categories[c] + '</div>';
        frag += '</div>';
    }
    frag += '</div>';
    return frag;
}

function calculerGraphiquesParSousObjectif(activitesRapport) {
    var PALETTE_OBJECTIFS = ['#1E4E8C', '#C9A227', '#1F6E43', '#B4790C', '#6E3B6E'];
    var objectifsRacine = [];
    for (var i = 0; i < elementsHierarchieData.length; i++) {
        var el = elementsHierarchieData[i];
        if (!el.parent_id) {
            objectifsRacine.push({ id: el.id, nom: el.nom, couleur: PALETTE_OBJECTIFS[objectifsRacine.length % PALETTE_OBJECTIFS.length] });
        }
    }

    var resultat = [];
    for (var o = 0; o < objectifsRacine.length; o++) {
        var objId = objectifsRacine[o].id;
        var parSousObjectif = {};
        var totalPlan = 0, totalReal = 0;
        for (var i = 0; i < activitesRapport.length; i++) {
            var h = getHierarchieActivite(activitesRapport[i]);
            if (h.objectifId !== objId) continue;
            var sk = h.sousObjectifId || 'none';
            if (!parSousObjectif[sk]) parSousObjectif[sk] = { label: h.sousObjectifCode || h.sousObjectifNom, planifiees: 0, realisees: 0 };
            parSousObjectif[sk].planifiees++;
            totalPlan++;
            if (calculerTauxSuivi(activitesRapport[i]) === 100) { parSousObjectif[sk].realisees++; totalReal++; }
        }

        var sousObjectifsListe = [];
        for (var sk in parSousObjectif) {
            var so = parSousObjectif[sk];
            sousObjectifsListe.push({ nom: so.label, taux: so.planifiees > 0 ? Math.round((so.realisees / so.planifiees) * 100) : 0 });
        }
        if (sousObjectifsListe.length > 0) {
            sousObjectifsListe.push({ nom: 'TOTAL', taux: totalPlan > 0 ? Math.round((totalReal / totalPlan) * 100) : 0 });
            resultat.push({ nom: objectifsRacine[o].nom, couleur: objectifsRacine[o].couleur, sousObjectifs: sousObjectifsListe });
        }
    }
    return resultat;
}

function calculerDonneesGraphiqueParObjectif(dashboardData) {
    var PALETTE_OBJECTIFS = ['#1E4E8C', '#C9A227', '#1F6E43', '#B4790C', '#6E3B6E'];

    var objectifsRacine = [];
    for (var i = 0; i < elementsHierarchieData.length; i++) {
        var el = elementsHierarchieData[i];
        if (!el.parent_id) {
            objectifsRacine.push({
                id: el.id,
                nom: el.nom,
                couleur: PALETTE_OBJECTIFS[objectifsRacine.length % PALETTE_OBJECTIFS.length]
            });
        }
    }

    var planifiees = [], nonCommencees = [], enCours = [], executees = [], tauxExecution = [];

    for (var o = 0; o < objectifsRacine.length; o++) {
        var objId = objectifsRacine[o].id;
        var activitesObjectif = [];
        for (var i = 0; i < dashboardData.length; i++) {
            var h = getHierarchieActivite(dashboardData[i]);
            if (h.objectifId === objId) activitesObjectif.push(dashboardData[i]);
        }

        var nc = 0, ec = 0, ex = 0;
        for (var i = 0; i < activitesObjectif.length; i++) {
            var t = calculerTauxSuivi(activitesObjectif[i]);
            if (t === 100) ex++;
            else if (t > 0) ec++;
            else nc++;
        }

        planifiees.push(activitesObjectif.length);
        nonCommencees.push(nc);
        enCours.push(ec);
        executees.push(ex);
        tauxExecution.push(activitesObjectif.length > 0 ? Math.round((ex / activitesObjectif.length) * 100) : 0);
    }

    return {
        objectifs: objectifsRacine,
        groupes: [
            { label: 'Planifiées', valeurs: planifiees },
            { label: 'Non Commencées', valeurs: nonCommencees },
            { label: 'En Cours', valeurs: enCours },
            { label: 'Exécutées', valeurs: executees },
            { label: 'Taux d\'Exécution', valeurs: tauxExecution, suffixe: '%' }
        ]
    };
}

function comparerCodesActivite(codeA, codeB) {
    codeA = codeA || '';
    codeB = codeB || '';
    // Extrait les nombres d'un code type "AS1.10" -> [1, 10]
    var nombresA = codeA.match(/\d+/g) || [];
    var nombresB = codeB.match(/\d+/g) || [];
    var maxLen = Math.max(nombresA.length, nombresB.length);
    for (var i = 0; i < maxLen; i++) {
        var na = nombresA[i] !== undefined ? parseInt(nombresA[i]) : 0;
        var nb = nombresB[i] !== undefined ? parseInt(nombresB[i]) : 0;
        if (na !== nb) return na - nb;
    }
    return codeA.localeCompare(codeB);
}

function getHierarchieActivite(activite) {
    var result = {
        objectifId: null, objectifNom: 'Non classé', objectifOrdre: 999999,
        sousObjectifId: null, sousObjectifCode: '', sousObjectifNom: '—', sousObjectifOrdre: 999999
    };

    if (!activite.element_hierarchie_id) return result;

    var el = null;
    for (var i = 0; i < elementsHierarchieData.length; i++) {
        if (elementsHierarchieData[i].id === activite.element_hierarchie_id) { el = elementsHierarchieData[i]; break; }
    }
    if (!el) return result;

    if (el.parent_id) {
        result.sousObjectifId = el.id;
        result.sousObjectifCode = el.code || '';
        result.sousObjectifNom = el.nom;
        result.sousObjectifOrdre = el.ordre || 0;

        var parent = null;
        for (var j = 0; j < elementsHierarchieData.length; j++) {
            if (elementsHierarchieData[j].id === el.parent_id) { parent = elementsHierarchieData[j]; break; }
        }
        if (parent) {
            result.objectifId = parent.id;
            result.objectifNom = parent.nom;
            result.objectifOrdre = parent.ordre || 0;
        }
    } else {
        result.objectifId = el.id;
        result.objectifNom = el.nom;
        result.objectifOrdre = el.ordre || 0;
    }

    return result;
}

function valeurChampActivite(activiteId, champId) {

            return valeursChampsActiviteData[i].valeur;
        }
    }
    return '';
}

async function loadHierarchieData(annee) {
    try {
        const { data: niveaux, error: errNiveaux } = await supabase
            .from('niveaux_config')
            .select('*')
            .eq('annee', annee)
            .order('profondeur', { ascending: true });
        if (errNiveaux) throw errNiveaux;
        niveauxConfigData = niveaux || [];

        const { data: elements, error: errElements } = await supabase
            .from('elements_hierarchie')
            .select('*')
            .eq('annee', annee)
            .order('ordre', { ascending: true });
        if (errElements) throw errElements;
        elementsHierarchieData = elements || [];

    } catch (error) {
        console.error('Erreur chargement hiérarchie:', error);
        alert('❌ Erreur lors du chargement de la hiérarchie : ' + error.message);
    }
}

async function changerAnneeHierarchie() {
    var annee = document.getElementById('hierarchie-annee').value.trim();
    if (!annee) { alert('Veuillez saisir une année'); return; }
    hierarchieAnneeSelectionnee = annee;
    await loadHierarchieData(annee);
    renderHierarchieConfigModal();
}

async function submitNouveauNiveau() {
    var nom = document.getElementById('nouveau-niveau-nom').value.trim();

    if (!nom) { alert('Veuillez saisir le nom du niveau'); return; }

    var prochaineProfondeur = 1;
    for (var i = 0; i < niveauxConfigData.length; i++) {
        if (niveauxConfigData[i].profondeur >= prochaineProfondeur) {
            prochaineProfondeur = niveauxConfigData[i].profondeur + 1;
        }
    }

    try {
        const { error } = await supabase.from('niveaux_config').insert({
            annee: hierarchieAnneeSelectionnee,
            profondeur: prochaineProfondeur,
            nom_niveau: nom
        });
        if (error) throw error;

        await loadHierarchieData(hierarchieAnneeSelectionnee);
        renderHierarchieConfigModal();
    } catch (error) {
        console.error('Erreur ajout niveau:', error);
        alert('❌ Erreur : ' + error.message);
    }
}

function libelleNomPourNiveau(niveau) {
    if (niveau.nom_niveau === 'Objectif') return 'Nom de l\'objectif';
    if (niveau.nom_niveau === 'Sous-Objectif') return 'Nom du sous-objectif';
    return 'Nom (' + niveau.nom_niveau + ')';
}

async function submitNouvelElement(niveauId) {
    var nomInput = document.getElementById('nouvel-element-nom-' + niveauId);
    var parentInput = document.getElementById('nouvel-element-parent-' + niveauId);
    var lettreInput = document.getElementById('nouvel-element-lettre-' + niveauId);

    var nom = nomInput.value.trim();
    var parentId = (parentInput && parentInput.value) ? parseInt(parentInput.value) : null;
    var lettreCode = (lettreInput && lettreInput.value.trim()) ? lettreInput.value.trim().toUpperCase() : null;

    if (!nom) { alert('Veuillez saisir le nom de l\'élément'); return; }

    // L'ordre correspond toujours au rang du code (même comptage que le declencheur SQL)
    var ordre = 0;
    for (var i = 0; i < elementsHierarchieData.length; i++) {
        var el = elementsHierarchieData[i];
        if (parentId) {
            if (el.parent_id == parentId) ordre++;
        } else {
            if (el.niveau_id === niveauId && !el.parent_id) ordre++;
        }
    }
    ordre = ordre + 1;

    try {
        const { error } = await supabase.from('elements_hierarchie').insert({
            annee: hierarchieAnneeSelectionnee,
            niveau_id: niveauId,
            parent_id: parentId,
            nom: nom,
            lettre_code: lettreCode,
            ordre: ordre,
            actif: true
        });
        if (error) throw error;

        await loadHierarchieData(hierarchieAnneeSelectionnee);
        renderHierarchieConfigModal();
    } catch (error) {
        console.error('Erreur ajout élément:', error);
        alert('❌ Erreur : ' + error.message);
    }
}

async function editerNiveau(id, nomActuel) {
    var nouveauNom = prompt('Nouveau nom du niveau :', nomActuel);
    if (nouveauNom === null) return;
    nouveauNom = nouveauNom.trim();
    if (!nouveauNom) { alert('Le nom ne peut pas être vide'); return; }

    try {
        const { error } = await supabase.from('niveaux_config').update({ nom_niveau: nouveauNom }).eq('id', id);
        if (error) throw error;
        await loadHierarchieData(hierarchieAnneeSelectionnee);
        renderHierarchieConfigModal();
    } catch (error) {
        console.error('Erreur modification niveau:', error);
        alert('❌ Erreur : ' + error.message);
    }
}

async function supprimerNiveau(id) {
    if (!confirm('Supprimer ce niveau ? Cela échouera si des éléments y sont encore rattachés.')) return;

    try {
        const { error } = await supabase.from('niveaux_config').delete().eq('id', id);
        if (error) throw error;
        await loadHierarchieData(hierarchieAnneeSelectionnee);
        renderHierarchieConfigModal();
    } catch (error) {
        console.error('Erreur suppression niveau:', error);
        alert('❌ Erreur : ' + error.message + '\n\nVérifiez qu\'aucun élément n\'est encore rattaché à ce niveau.');
    }
}

async function editerElementHierarchie(id) {
    var el = null;
    for (var i = 0; i < elementsHierarchieData.length; i++) {
        if (elementsHierarchieData[i].id === id) { el = elementsHierarchieData[i]; break; }
    }
    if (!el) return;

    var nouveauNom = prompt('Nouveau nom :', el.nom);
    if (nouveauNom === null) return;
    nouveauNom = nouveauNom.trim();
    if (!nouveauNom) { alert('Le nom ne peut pas être vide'); return; }

    var updateObj = { nom: nouveauNom };

    if (!el.parent_id) {
        var nouvelleLettre = prompt('Lettre de code pour les enfants (laisser vide si aucune) :', el.lettre_code || '');
        if (nouvelleLettre !== null) {
            updateObj.lettre_code = nouvelleLettre.trim() ? nouvelleLettre.trim().toUpperCase() : null;
        }
    }

    try {
        const { error } = await supabase.from('elements_hierarchie').update(updateObj).eq('id', id);
        if (error) throw error;
        await loadHierarchieData(hierarchieAnneeSelectionnee);
        renderHierarchieConfigModal();
    } catch (error) {
        console.error('Erreur modification élément:', error);
        alert('❌ Erreur : ' + error.message);
    }
}

async function supprimerElementHierarchie(id) {
    if (!confirm('Supprimer cet élément ? Cela échouera si des sous-éléments ou des activités y sont encore rattachés.')) return;

    try {
        const { error } = await supabase.from('elements_hierarchie').delete().eq('id', id);
        if (error) throw error;
        await loadHierarchieData(hierarchieAnneeSelectionnee);
        renderHierarchieConfigModal();
    } catch (error) {
        console.error('Erreur suppression élément:', error);
        alert('❌ Erreur : ' + error.message + '\n\nVérifiez qu\'aucun sous-élément ou activité n\'y est encore rattaché.');
    }
}

async function toggleElementHierarchieActif(elementId, actuel) {
    try {
        const { error } = await supabase
            .from('elements_hierarchie')
            .update({ actif: !actuel })
            .eq('id', elementId);
        if (error) throw error;

        await loadHierarchieData(hierarchieAnneeSelectionnee);
        renderHierarchieConfigModal();
    } catch (error) {
        console.error('Erreur changement statut élément:', error);
        alert('❌ Erreur : ' + error.message);
    }
}
